name: 功能建议（Feature）
description: 新功能或体验改进的想法
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你的使用场景
      description: 什么情况下需要这个功能（比功能本身更重要）
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选。你考虑过的其他做法
