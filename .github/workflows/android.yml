name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# New repos default the workflow token to read-only; releases need write.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 mirrors the dev environment; npm 12 (needed for
          # patchedDependencies) itself requires Node >= 22.
          node-version: 24

      # npm patchedDependencies (our gradle-plugin patch) needs npm >= 12;
      # Node 20 bundles npm 10 which silently ignores the patch config.
      - name: Upgrade npm
        run: npm install -g npm@12

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (workspaces + npm patches)
        run: npm install

      - name: Verify gradle-plugin patch applied
        run: |
          if grep -q "foojay-resolver-convention" node_modules/@react-native/gradle-plugin/settings.gradle.kts; then
            echo "::error::npm patch did not apply — build would fail on Gradle 9"
            exit 1
          fi

      - name: Run core-shell tests
        run: npx vitest run

      # Launcher icon badge per channel (α for alpha tags, β for beta tags,
      # clean icon otherwise) so pre-release installs are easy to tell apart.
      - name: Regenerate launcher icon with channel badge
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          case "${GITHUB_REF_NAME}" in
            *alpha*) BADGE="alpha" ;;
            *beta*)  BADGE="beta" ;;
            *)       BADGE="none" ;;
          esac
          uv run --with pillow python scripts/gen-icon.py --badge "$BADGE"
      - name: Decode release signing key
        env:
          ZS_KEYSTORE_BASE64: ${{ secrets.ZS_KEYSTORE_BASE64 }}
        run: printf '%s' "$ZS_KEYSTORE_BASE64" | base64 -d > "$HOME/zshell-release.keystore"

      - name: Build release APK (signed with the private release key)
        working-directory: apps/mobile/android
        env:
          ZS_KEYSTORE_PASSWORD: ${{ secrets.ZS_KEYSTORE_PASSWORD }}
          ZS_KEY_ALIAS: ${{ secrets.ZS_KEY_ALIAS }}
          ZS_KEY_PASSWORD: ${{ secrets.ZS_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PZS_STORE_FILE="$HOME/zshell-release.keystore" \
            -PZS_STORE_PASSWORD="$ZS_KEYSTORE_PASSWORD" \
            -PZS_KEY_ALIAS="$ZS_KEY_ALIAS" \
            -PZS_KEY_PASSWORD="$ZS_KEY_PASSWORD"

      # Guard: if the secrets were ever missing, gradle would silently fall
      # back to the debug key and users could not upgrade in place.
      - name: Verify APK is signed with the private release key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/ZShell-*-arm64-v8a-release.apk)
          if ! "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=ZShell"; then
            echo "::error::APK not signed with the private release key (secrets missing?)"
            exit 1
          fi
          echo "release signature verified"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zshell-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/ZShell-*-release.apk
          if-no-files-found: error

      # Tag pushes (v*) publish a GitHub Release with the APK attached —
      # the download entry point for phones (no login needed on public repos).
      # Release notes are extracted from the matching CHANGELOG.md section.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          awk -v tag="[${VER}]" '
            index($0, "## " tag) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ${TAG}"
            exit 1
          fi

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/ZShell-*-release.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
